[project]
name = "avouch"
version = "0.1.0"
description = "An agentic red-teaming and evaluation framework for LLM safety"
authors = [{ name = "Swapnil Anil Kale", email = "swapnil2304@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "groq (>=1.2.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "openai (>=2.38.0,<3.0.0)",
    "google-genai (>=2.6.0,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "typer (>=0.26.4,<0.27.0)",
    "langgraph (>=1.2.4,<2.0.0)",
    "streamlit (>=1.58.0,<2.0.0)",
]

[project.scripts]
avouch = "avouch.cli:app"

[tool.poetry]
packages = [{ include = "avouch", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
